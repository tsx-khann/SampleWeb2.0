<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Interactive Map</title>

<link rel="stylesheet" href="css/leaflet.css">
<link rel="stylesheet" href="css/MarkerCluster.css">
<link rel="stylesheet" href="css/MarkerCluster.Default.css">

<style>

/* RESET */
html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #1c1c1e;
}

/* HEADER */
.header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;

    padding: 14px 12px 10px;

    background: rgba(28,28,30,0.95);
    backdrop-filter: blur(18px);

    color: white;
    text-align: center;

    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
}

.header h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

.header h2 {
    margin: 4px 0 0;
    font-size: 13px;
    font-weight: 400;
    color: #d1d1d6;
}

.header p {
    margin: 4px 0 10px;
    font-size: 12px;
    color: #a1a1a6;
}

/* SEARCH BOX */
.search-box {
    display: flex;
    justify-content: center;
}

/* INPUT */
.search-box input {
    width: 85%;
    max-width: 420px;

    padding: 10px 12px;

    border-radius: 12px;
    border: none;
    outline: none;

    background: #2c2c2e;
    color: white;
}

/* DROPDOWN */
.dropdown {
    position: absolute;

    top: 115px; /* position under search bar */
    left: 50%;
    transform: translateX(-50%);

    width: 85%;
    max-width: 420px;

    background: rgba(28,28,30,0.98);

    border-radius: 12px;
    overflow: hidden;

    z-index: 3000;

    display: none;

    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
}

.dropdown-item {
    padding: 10px 12px;
    color: white;
    font-size: 14px;
    cursor: pointer;
    border-bottom: 1px solid rgba(255,255,255,0.05);
}

.dropdown-item:hover {
    background: rgba(255,255,255,0.08);
}

/* MAP */
#map {
    position: absolute;
    top: 170px;
    bottom: 0;
    left: 0;
    right: 0;
    background: #1c1c1e;
}

/* POPUP */
.modern-popup {
    width: 280px;
    overflow: hidden;
    border-radius: 18px;
    background: rgba(28,28,30,0.96);
    color: white;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}

.popup-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
}

.popup-content {
    padding: 14px;
}

.popup-title {
    margin: 0;
    font-size: 18px;
    font-weight: 700;
}

.popup-description {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.5;
    color: #d1d1d6;
}

/* REMOVE ATTRIBUTION */
.leaflet-control-attribution {
    display: none !important;
}

/* CLEAN POPUP */
.leaflet-popup-content-wrapper {
    background: transparent !important;
    box-shadow: none !important;
}

.leaflet-popup-tip {
    background: #1c1c1e !important;
}

.leaflet-popup-content {
    margin: 0 !important;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

    <h1>Poblacion, Taytay, Palawan</h1>
    <h2><b>INTERACTIVE MAP</b></h2>
    <p>By: Lara & Fabre</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search landmark...">
    </div>

    <div id="dropdown" class="dropdown"></div>

</div>

<!-- MAP -->
<div id="map"></div>

<script src="js/leaflet.js"></script>
<script src="js/leaflet.markercluster.js"></script>

<!-- QGIS DATA -->
<script src="data/Landmark_1.js"></script>

<script>

/* ======================
   MAP INIT (FAST + LOCKED)
====================== */

var map = L.map('map', {
    zoomControl: true,
    minZoom: 14,
    maxZoom: 20
}).setView([10.823, 119.517], 15);

/* LOCK AREA */
var bounds = L.latLngBounds(
    [10.80, 119.48],
    [10.85, 119.55]
);

map.setMaxBounds(bounds);
map.on('drag', function () {
    map.panInsideBounds(bounds, { animate: false });
});

/* BASEMAP (FAST) */
L.tileLayer('https://basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png', {
    maxZoom: 20,
    updateWhenIdle: true,
    updateWhenZooming: false,
    keepBuffer: 2,
    attribution: ''
}).addTo(map);

/* ICON */
var icon = L.icon({
    iconUrl: 'markers/Landmark_1.svg',
    iconSize: [40, 40],
    iconAnchor: [20, 40]
});

/* CLUSTER */
var cluster = L.markerClusterGroup();

/* MARKERS ARRAY */
var markers = [];

/* GEOJSON */
var layer = L.geoJSON(json_Landmark_1, {

    pointToLayer: function(feature, latlng) {
        return L.marker(latlng, { icon: icon });
    },

    onEachFeature: function(feature, layer) {

        var name = feature.properties.Name || "Unknown";
        var desc = feature.properties.Discriptio || "No description available.";
        var image = feature.properties.Image || "images/default.jpg";

        layer.bindPopup(`
            <div class="modern-popup">
                <img src="${image}" class="popup-image">
                <div class="popup-content">
                    <h2 class="popup-title">${name}</h2>
                    <div class="popup-description">${desc}</div>
                </div>
            </div>
        `);

        layer.featureName = name.toLowerCase();
        markers.push(layer);
    }
});

/* FAST LOAD */
setTimeout(function () {
    cluster.addLayer(layer);
    map.addLayer(cluster);
}, 50);

/* ======================
   SEARCH DROPDOWN
====================== */

var dropdown = document.getElementById("dropdown");

document.getElementById("searchInput").addEventListener("input", function(e) {

    var value = e.target.value.toLowerCase().trim();

    dropdown.innerHTML = "";

    if (value === "") {
        dropdown.style.display = "none";
        return;
    }

    var matches = [];

    markers.forEach(function(marker) {
        if (marker.featureName.includes(value)) {
            matches.push(marker);
        }
    });

    if (matches.length === 0) {
        dropdown.style.display = "none";
        return;
    }

    dropdown.style.display = "block";

    matches.slice(0, 6).forEach(function(marker) {

        var div = document.createElement("div");
        div.className = "dropdown-item";
        div.innerText = marker.featureName;

        div.onclick = function() {

            map.setView(marker.getLatLng(), 18);
            marker.openPopup();

            dropdown.style.display = "none";
            document.getElementById("searchInput").value = marker.featureName;
        };

        dropdown.appendChild(div);
    });

});

/* CLOSE DROPDOWN ON OUTSIDE CLICK */
document.addEventListener("click", function(e) {
    if (!e.target.closest(".header")) {
        dropdown.style.display = "none";
    }
});

</script>

</body>
</html>
